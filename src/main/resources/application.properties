spring.application.name=Backend_TechStore
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dbTechStore}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.jpa.defer-datasource-initialization=true

#No envia el trace al usuario cuando hay error.
spring.web.error.include-stacktrace=never
ip.frontend=${IP_FRONTEND:http://localhost:4200}

jwt.secret=${JWT_SECRET:dev-only-change-this-jwt-secret-before-deploying-techstore-2026}
